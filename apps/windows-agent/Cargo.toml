[package]
name = "emi-device-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
chrono.workspace = true
clap.workspace = true
emi-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
sha2 = "0.10"
zeroize = "1.9"

[dev-dependencies]
chrono.workspace = true
ed25519-dalek = "2"
tempfile = "3"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
windows-service = "0.8"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[[bin]]
name = "emi-device-agent"
path = "src/main.rs"

[[bin]]
name = "emi-device-ui"
path = "src/bin/emi-device-ui.rs"
