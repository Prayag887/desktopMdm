name: Windows desktop release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-desktop:
    runs-on: windows-latest
    env:
      # Add these repo secrets to enable Authenticode signing:
      #   CODE_SIGN_PFX_BASE64     - base64 of your OV/EV code-signing .pfx
      #   CODE_SIGN_PFX_PASSWORD   - the .pfx password
      # Without them the signing step is skipped and the build is unsigned.
      SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false
      - run: cargo build --release --package emi-device-agent
      - name: Code-sign binaries (only if a certificate secret is configured)
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            target/release/emi-device-agent.exe target/release/emi-device-ui.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed ($LASTEXITCODE)" }
          Remove-Item $pfx -Force
      - name: Package desktop app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/emi-device-agent-windows-x64 | Out-Null
          Copy-Item target/release/emi-device-agent.exe dist/emi-device-agent-windows-x64/
          Copy-Item target/release/emi-device-ui.exe dist/emi-device-agent-windows-x64/
          Copy-Item packaging/windows/*.ps1 dist/emi-device-agent-windows-x64/
          Copy-Item packaging/windows/*.cmd dist/emi-device-agent-windows-x64/
          Copy-Item README.md,LICENSE dist/emi-device-agent-windows-x64/
          Compress-Archive dist/emi-device-agent-windows-x64/* dist/emi-device-agent-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: emi-device-agent-windows-x64
          path: dist/emi-device-agent-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/emi-device-agent-windows-x64.zip
