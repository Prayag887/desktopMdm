name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --package emi-device-agent
      - name: Package agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/emi-device-agent-windows-x64 | Out-Null
          Copy-Item target/release/emi-device-agent.exe dist/emi-device-agent-windows-x64/
          Copy-Item target/release/emi-device-ui.exe dist/emi-device-agent-windows-x64/
          Copy-Item packaging/windows/*.ps1 dist/emi-device-agent-windows-x64/
          Copy-Item README.md,LICENSE dist/emi-device-agent-windows-x64/
          Compress-Archive dist/emi-device-agent-windows-x64/* dist/emi-device-agent-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: emi-device-agent-windows-x64
          path: dist/emi-device-agent-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/emi-device-agent-windows-x64.zip
