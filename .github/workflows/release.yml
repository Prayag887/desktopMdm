name: Windows desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: 'Publish an explicitly labeled unsigned release (no publisher signature)'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Avoid requiring the Microsoft Visual C++ Redistributable on customer PCs.
      RUSTFLAGS: -C target-feature=+crt-static
      # Add these repo secrets to enable Authenticode signing:
      #   CODE_SIGN_PFX_BASE64     - base64 of your OV/EV code-signing .pfx
      #   CODE_SIGN_PFX_PASSWORD   - the .pfx password
      # Tag pushes require signing. Unsigned publishing requires explicit manual opt-in.
      ALLOW_UNSIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned }}
      SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
      SIGN_CERT_SHA1: ${{ vars.CODE_SIGN_CERT_SHA1 }}
      PRIVATE_TRUST: ${{ vars.CODE_SIGN_PRIVATE_TRUST }}
    steps:
      - uses: actions/checkout@v6
      - name: Trust the repository private signing identity on this runner
        if: env.PRIVATE_TRUST == 'true' && env.ALLOW_UNSIGNED != 'true'
        shell: powershell
        run: |
          ./packaging/windows/Install-PublisherTrust.ps1
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path packaging/windows/emi-publisher.cer).Path)
          try {
            if ($certificate.Thumbprint -ne $env:SIGN_CERT_SHA1) { throw 'Configured signing identity does not match the pinned certificate' }
          } finally { $certificate.Dispose() }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false
      - name: Validate release mode and signing identity
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -notlike 'refs/tags/v*') {
            throw 'Run this workflow against a version tag (v*), not a branch.'
          }
          if ($env:ALLOW_UNSIGNED -eq 'true') {
            Write-Warning 'Explicit unsigned release: binaries will have no verified publisher signature.'
          } elseif (-not $env:SIGN_PFX_BASE64 -or -not $env:SIGN_PFX_PASSWORD -or $env:SIGN_CERT_SHA1 -notmatch '^[A-Fa-f0-9]{40}$') {
            throw 'Production release blocked: configure CODE_SIGN_PFX_BASE64, CODE_SIGN_PFX_PASSWORD, and CODE_SIGN_CERT_SHA1, or integrate your managed signing service. For an explicitly labeled unsigned release, manually dispatch this workflow on the version tag with allow_unsigned enabled.'
          }
      - run: cargo build --locked --release --package emi-device-agent
      - name: Test Windows agent before publishing
        run: cargo test --locked --package emi-device-agent
      - name: Verify Windows scripts and protection checks
        shell: pwsh
        run: |
          Get-ChildItem packaging/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          ./packaging/windows/tests/Test-StateAcl.ps1 -AgentPath ./target/debug/emi-device-agent.exe
          ./packaging/windows/tests/Test-CompanionLaunch.ps1
          ./packaging/windows/tests/Test-ProtectionAcl.ps1
          ./packaging/windows/tests/Test-SecurityPosture.ps1
          ./packaging/windows/tests/Test-UntrustedRepair.ps1
          ./packaging/windows/tests/Test-PublisherTrust.ps1
          ./packaging/windows/tests/Test-ExplorerContextPolicy.ps1
          ./packaging/windows/tests/Test-SignInPowerPolicy.ps1
          ./packaging/windows/tests/Test-RecoveryPagePolicy.ps1
          ./packaging/windows/tests/Test-StandardUserPolicy.ps1
          ./packaging/windows/tests/Test-OfflineBitLocker.ps1
          ./packaging/windows/tests/Test-StandardUserNative.ps1
          ./packaging/windows/tests/Test-RecoveryTools.ps1
          ./packaging/windows/tests/Test-RecoveryTaskId.ps1
      - name: Verify binaries do not require the Visual C++ runtime
        shell: pwsh
        run: |
          $objdump = 'C:\Program Files\LLVM\bin\llvm-objdump.exe'
          if (-not (Test-Path $objdump)) { throw "llvm-objdump.exe not found at $objdump" }
          foreach ($binary in 'target/release/emi-device-agent.exe', 'target/release/emi-device-ui.exe', 'target/release/RepairWatchdog.exe', 'target/release/emi-device-updater.exe') {
            $imports = & $objdump -p $binary
            if ($imports -match '(?i)(VCRUNTIME|MSVCP|UCRTBASE).*\.dll') {
              throw "$binary still depends on the Visual C++ runtime"
            }
          }
      - name: Sign and verify production binaries
        if: env.ALLOW_UNSIGNED != 'true'
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
              Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
            if (-not $signtool) { throw 'signtool.exe not found' }
            & $signtool sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target/release/emi-device-agent.exe target/release/emi-device-ui.exe target/release/RepairWatchdog.exe target/release/emi-device-updater.exe
            if ($LASTEXITCODE -ne 0) { throw "signing failed ($LASTEXITCODE)" }
            foreach ($binary in 'target/release/emi-device-agent.exe', 'target/release/emi-device-ui.exe', 'target/release/RepairWatchdog.exe', 'target/release/emi-device-updater.exe') {
              $signature = Get-AuthenticodeSignature $binary
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:SIGN_CERT_SHA1 -or -not $signature.TimeStamperCertificate) {
                throw "Invalid publisher signature or missing timestamp: $binary"
              }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Package desktop app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/emi-device-agent-windows-x64 | Out-Null
          Copy-Item target/release/emi-device-agent.exe dist/emi-device-agent-windows-x64/
          Copy-Item target/release/emi-device-ui.exe dist/emi-device-agent-windows-x64/
          Copy-Item target/release/RepairWatchdog.exe dist/emi-device-agent-windows-x64/
          Copy-Item target/release/emi-device-updater.exe dist/emi-device-agent-windows-x64/
          Copy-Item packaging/windows/*.ps1 dist/emi-device-agent-windows-x64/
          Copy-Item packaging/windows/*.cmd dist/emi-device-agent-windows-x64/
          Copy-Item packaging/windows/recovery-public-key.hex dist/emi-device-agent-windows-x64/
          Copy-Item packaging/windows/emi-publisher.cer dist/emi-device-agent-windows-x64/
          Copy-Item packaging/windows/intune dist/emi-device-agent-windows-x64/intune -Recurse
          New-Item -ItemType Directory -Force dist/emi-device-agent-windows-x64/docs | Out-Null
          Copy-Item docs/offline-reset-recovery.md dist/emi-device-agent-windows-x64/docs/
          Copy-Item docs/local-device-hardening.md dist/emi-device-agent-windows-x64/docs/
          Copy-Item README.md,LICENSE dist/emi-device-agent-windows-x64/
          if ($env:ALLOW_UNSIGNED -eq 'true') {
            'UNSIGNED RELEASE: These executables have no verified publisher signature. Windows may show an unknown publisher or SmartScreen warning.' | Set-Content dist/emi-device-agent-windows-x64/UNSIGNED.txt -Encoding utf8
          }
          # Hash final binaries and all executable scripts, then authenticate the manifest.
          $manifest = [ordered]@{}
          Get-ChildItem dist/emi-device-agent-windows-x64 -File | Where-Object { $_.Extension -in @('.exe','.ps1','.cmd','.hex','.cer') } | Sort-Object Name | ForEach-Object {
            $manifest[$_.Name] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifestPath = 'dist/emi-device-agent-windows-x64/protection-manifest.ps1'
          ('# EMI-MANIFEST ' + ($manifest | ConvertTo-Json -Compress)) | Set-Content $manifestPath -Encoding utf8BOM
          if ($env:ALLOW_UNSIGNED -ne 'true') {
            $pfx = Join-Path $env:RUNNER_TEMP 'manifest-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
              $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:SIGN_PFX_PASSWORD, [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
              try {
                $signature = Set-AuthenticodeSignature -FilePath $manifestPath -Certificate $certificate -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
                if ($signature.Status -ne 'Valid') { throw 'Manifest signing failed' }
              } finally { $certificate.Dispose() }
              . ./packaging/windows/Protection-Integrity.ps1
              $verified = Test-ProtectionIntegrity (Resolve-Path dist/emi-device-agent-windows-x64).Path $env:SIGN_CERT_SHA1
              if (-not $verified.verified) { throw 'Release manifest verification failed' }
            } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
          }
          if ($env:ALLOW_UNSIGNED -ne 'true') {
            ./packaging/windows/tests/Test-Installer.ps1 -PackagePath (Resolve-Path dist/emi-device-agent-windows-x64).Path
          }
          Compress-Archive dist/emi-device-agent-windows-x64/* dist/emi-device-agent-windows-x64.zip
          $hash = (Get-FileHash dist/emi-device-agent-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  emi-device-agent-windows-x64.zip" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload recovery capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-capture-diagnostics
          if-no-files-found: ignore
          path: |
            C:/Recovery/Customizations/EmiCapture-*/ScanState.log
            C:/Recovery/Customizations/EmiCapture-*/capture-report.json
            C:/Recovery/Customizations/EmiCapture-*/EmiDeviceAgent.xml
      - uses: actions/upload-artifact@v4
        with:
          name: emi-device-agent-windows-x64
          path: dist/emi-device-agent-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: ${{ github.ref_name }}
          body: >-
            ${{ env.ALLOW_UNSIGNED == 'true' && '**Unsigned release:** These executables have no verified publisher signature. Windows may show an unknown publisher or SmartScreen warning. See UNSIGNED.txt in the download.' || (env.PRIVATE_TRUST == 'true' && '**Private publisher signature:** Signed with the repository self-issued certificate. Run install.cmd as administrator to install the pinned public certificate before installing the app. This is not a publicly trusted publisher identity.' || '') }}
            Hardened local provisioning now verifies an owner administrator, reduces the named customer's local privileges, saves offline BitLocker recovery keys before enabling encryption, and captures offline reset recovery. The service verifies the installed UI executable path rather than trusting its process name. See docs/local-device-hardening.md for the explicit Provision.ps1 -Harden command and prerequisites. These deployment tools require a trusted Windows installation and per-PC setup; they do not make the application undeletable.
            install.cmd now automatically prepares Microsoft ADK ScanState tools and captures a device-specific offline reset recovery package. Initial tool setup requires internet access and can take several minutes. Installation reports failure if tool setup or capture fails. Existing recovery packages require explicit archiving before recapture. See docs/offline-reset-recovery.md. GitHub Actions verifies actual app installation, Microsoft ADK preparation, and safe failure when ScanState rejects its Windows Server runner. Successful Windows 11 capture and reset restoration remain unverified; there is no factory-reset guarantee. Disabling preinstalled-app restoration, disk wipes, SSD replacement, and local-administrator removal can bypass local recovery. Captured state is a snapshot; fresh management commands require network access and valid enrollment with the existing API.
          generate_release_notes: true
          prerelease: ${{ env.ALLOW_UNSIGNED == 'true' }}
          files: |
            dist/emi-device-agent-windows-x64.zip
            dist/SHA256SUMS.txt
