name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-hardening:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify local account hardening and offline encryption safety
        shell: powershell
        run: |
          Get-ChildItem packaging/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          ./packaging/windows/tests/Test-StandardUserPolicy.ps1
          ./packaging/windows/tests/Test-OfflineBitLocker.ps1
          ./packaging/windows/tests/Test-StandardUserNative.ps1
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  windows:
    # The desktop UI (`emi-device-ui`) is entirely behind `#[cfg(windows)]`, so the
    # Linux job above never compiles a line of it.
    runs-on: windows-latest
    env:
      # Match release linkage and catch static-CRT build regressions in CI.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - run: cargo clippy --package emi-device-agent --all-targets -- -D warnings
      - run: cargo test --package emi-device-agent
      - name: Validate Windows installer scripts
        shell: pwsh
        run: |
          Get-ChildItem packaging/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Verify state and recovery mailbox ACLs
        shell: pwsh
        run: ./packaging/windows/tests/Test-StateAcl.ps1 -AgentPath ./target/debug/emi-device-agent.exe
      - name: Verify optional desktop launch failure handling
        shell: pwsh
        run: ./packaging/windows/tests/Test-CompanionLaunch.ps1
      - name: Verify installation ACL protection
        shell: pwsh
        run: ./packaging/windows/tests/Test-ProtectionAcl.ps1
      - name: Verify security posture providers and safe provisioning
        shell: pwsh
        run: ./packaging/windows/tests/Test-SecurityPosture.ps1
      - name: Reject unauthenticated repair packages
        shell: pwsh
        run: ./packaging/windows/tests/Test-UntrustedRepair.ps1
